name: Publicar ZIP 1.3.0
on:
  push:
    branches: [main]
    paths:
      - '.release/1.3.0/**'
      - '.github/workflows/publicar-1.3.0.yml'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconstruir e verificar o ZIP testado
        shell: python
        run: |
          import base64, hashlib, pathlib, zipfile
          parts = sorted(pathlib.Path('.release/1.3.0').glob('*.b64'))
          assert len(parts) == 26, 'Quantidade de partes incorreta'
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(data).hexdigest() == '25111a833f0d1d7c742ee222e08e073bb0b178f7d312508f3ecc139718fadbdb'
          target = pathlib.Path('plugin.video.animesplay-1.3.0.zip')
          target.write_bytes(data)
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None
              assert 'plugin.video.animesplay/addon.xml' in archive.namelist()
      - name: Publicar arquivo para download direto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin.video.animesplay-1.3.0.zip
          git diff --cached --quiet && exit 0
          git commit -m "Disponibilizar ZIP AnimesPlay 1.3.0 verificado"
          git push origin HEAD:main
