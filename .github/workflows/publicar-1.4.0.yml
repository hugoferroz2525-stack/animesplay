name: Publicar ZIP 1.4.0
on:
  push:
    branches: [main]
    paths:
      - '.release/1.4.0/**'
      - '.github/workflows/publicar-1.4.0.yml'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconstruir e verificar o ZIP auditado
        shell: python
        run: |
          import base64, hashlib, pathlib, zipfile
          parts = sorted(pathlib.Path('.release/1.4.0').glob('*.b64'))
          assert len(parts) == 26
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(data).hexdigest() == '0e8bb1f509f09c99ee70c8fbd337ab5b53b1c74e9d58224bf668dbca62ad6f2e'
          target = pathlib.Path('plugin.video.animesplay-1.4.0.zip')
          target.write_bytes(data)
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None
              config = archive.read('plugin.video.animesplay/resources/lib/animesplay/metadata/config.py').decode()
              assert "DEFAULT_API_KEY = ''" in config
      - name: Disponibilizar download direto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin.video.animesplay-1.4.0.zip
          git diff --cached --quiet && exit 0
          git commit -m "Disponibilizar AnimesPlay 1.4.0 verificado sem credencial embutida"
          git push origin HEAD:main
